[package]
name = "photosweet-cli"
description = "Headless Photosweet: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional photosweet-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["photosweet-codecs/heif"]

[lints]
workspace = true

[lib]
name = "photosweet_cli"
path = "src/lib.rs"

[[bin]]
name = "photosweet-cli"
path = "src/main.rs"

[dependencies]
photosweet-automation = { path = "../../crates/automation" }
photosweet-engine = { workspace = true }
photosweet-io = { workspace = true }
photosweet-format = { path = "../../crates/format" }
photosweet-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# Icon + VERSIONINFO for photosweet-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

