name: Capture demo images

# Temporary workflow: renders the real UI offscreen through the snapshot example and uploads the
# PNGs as an artifact, so the README's screenshots can be re-shot without a local build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev \
            mesa-vulkan-drivers libvulkan1 libegl-mesa0 libgl1-mesa-dri

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          cache-on-failure: true

      - name: Fetch public-domain artwork
        run: |
          ua="Photosweet-dev"
          mkdir -p art
          get() { curl -fsSL --retry 3 -A "$ua" -o "art/$1" "https://commons.wikimedia.org/wiki/Special:FilePath/$2?width=2400"; }
          get wave.jpg        "Tsunami_by_hokusai_19th_century.jpg"
          get girl.jpg        "1665_Girl_with_a_Pearl_Earring.jpg"
          get sierra.jpg      "Albert_Bierstadt_-_Among_the_Sierra_Nevada,_California_-_Google_Art_Project.jpg"
          get earthrise.jpg   "NASA-Apollo8-Dec24-Earthrise.jpg"
          get waterlilies.jpg "Claude_Monet_-_Water_Lilies_-_1906,_Ryerson.jpg"
          get starrynight.jpg "Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg"
          get kiss.jpg        "Gustav_Klimt_016.jpg"
          get tetons.jpg      "Adams_The_Tetons_and_the_Snake_River.jpg"
          ls -l art

      - name: Build the snapshot example
        run: cargo build -p photosweet-ui-egui --example snapshot

      - name: Capture
        env:
          WGPU_BACKEND: vulkan
          SNAPSHOT_TIMING: "1"
        run: |
          set -u
          mkdir -p out
          shot() {
            name="$1"; shift
            echo "=== $name ==="
            cargo run -q -p photosweet-ui-egui --example snapshot -- \
              --out "out/$name.png" --size 1440x900 --scale 2 "$@" || echo "FAILED $name"
          }

          shot 01-hero --open art/wave.jpg --system-theme dark --script '[
            ["ui.set", {"theme": "pro", "tool": "move"}],
            ["layer.newAdjustmentLayer.curves", {"points": [[0,0],[64,48],[160,190],[255,255]]}],
            ["layer.setProps", {"name": "Tone curve"}],
            ["layer.newAdjustmentLayer.vibrance", {"vibrance": 35, "saturation": 6}],
            ["layer.setProps", {"name": "Vibrance", "blend": "Soft Light", "opacity": 0.7}],
            ["shape.create", {"kind": "rect", "rect": [180, 240, 1180, 430], "fill": "#f8fafc", "name": "Caption card"}],
            ["layer.layerStyle.dropShadow", {"distance": 26, "size": 48, "opacity": 0.42}],
            ["type.create", {"x": 270, "y": 400, "text": "The Great Wave", "size": 130, "name": "Title"}],
            ["type.create", {"x": 280, "y": 590, "text": "Katsushika Hokusai  ·  1831", "size": 44, "name": "Credit"}],
            ["layer.select", {"name": "Title"}],
            ["ui.menu.invoke", {"id": "image.adjustments.curves"}]
          ]'

          shot 02-mask --open art/girl.jpg --system-theme light --script '[
            ["ui.set", {"theme": "studioLight", "tool": "move"}],
            ["select.rect", {"x": 430, "y": 260, "width": 520, "height": 700, "ellipse": true}],
            ["layer.newAdjustmentLayer.hueSaturation", {"hue": 0, "saturation": -100}],
            ["layer.setProps", {"name": "Black and White"}],
            ["layer.layerMask.revealSelection", {}],
            ["layer.select", {"name": "Black and White"}]
          ]'

          shot 03-type --open art/sierra.jpg --system-theme dark --script '[
            ["ui.set", {"theme": "pro", "tool": "type"}],
            ["layer.newAdjustmentLayer.levels", {"input": [10, 245]}],
            ["layer.setProps", {"name": "Levels", "opacity": 0.85}],
            ["type.create", {"x": 150, "y": 220, "text": "SIERRA NEVADA", "size": 148, "name": "Headline"}],
            ["type.create", {"x": 160, "y": 420, "text": "Albert Bierstadt  ·  1868", "size": 52, "name": "Byline"}],
            ["type.create", {"x": 160, "y": 640, "text": "A landscape painted in a single summer, from sketches made on the trail.", "size": 44, "name": "Caption"}],
            ["layer.select", {"name": "Headline"}]
          ]'

          shot 04-style --open art/earthrise.jpg --system-theme dark --script '[
            ["ui.set", {"theme": "pro", "tool": "move"}],
            ["type.create", {"x": 320, "y": 520, "text": "EARTHRISE", "size": 170, "name": "EARTHRISE"}],
            ["layer.layerStyle.outerGlow", {"size": 34, "color": "#f59e0b"}],
            ["layer.layerStyle.stroke", {"size": 3, "color": "#f8fafc", "add": true}],
            ["ui.dialog.open", {"kind": "layerStyle", "effect": "outerGlow"}]
          ]'

          shot 05-vector --open art/waterlilies.jpg --system-theme dark --script '[
            ["ui.set", {"theme": "pro", "tool": "directSelection"}],
            ["layer.newAdjustmentLayer.curves", {"points": [[0,0],[128,132],[255,255]]}],
            ["layer.setProps", {"name": "Depth"}],
            ["shape.create", {"kind": "ellipse", "rect": [300, 300, 620, 620], "fill": "#8b5cf6", "name": "Badge"}],
            ["shape.create", {"kind": "ellipse", "rect": [380, 380, 460, 460], "fill": "#f43f5e", "name": "Sun"}],
            ["shape.create", {"kind": "star", "rect": [530, 530, 160, 160], "fill": "#fbbf24", "name": "Spark"}],
            ["layer.select", {"name": "Spark"}]
          ]'

          shot 06-filter --open art/starrynight.jpg --system-theme dark --script '[
            ["ui.set", {"theme": "pro", "tool": "move"}],
            ["select.rect", {"x": 420, "y": 300, "width": 620, "height": 620, "ellipse": true}],
            ["ui.menu.invoke", {"id": "filter.distort.twirl"}]
          ]'

          shot 07-export --open art/kiss.jpg --system-theme light --script '[
            ["ui.set", {"theme": "studioLight", "tool": "move"}],
            ["layer.newAdjustmentLayer.brightnessContrast", {"brightness": 6, "contrast": 14}],
            ["layer.setProps", {"name": "Light"}],
            ["ui.menu.invoke", {"id": "file.export.exportAs"}]
          ]'

          shot 08-transform --open art/tetons.jpg --system-theme dark --script '[
            ["ui.set", {"theme": "pro", "tool": "move"}],
            ["select.all", {}],
            ["edit.freeTransform", {}],
            ["ui.pointer", {"events": [{"kind": "down", "x": 300, "y": 300}, {"kind": "move", "x": 620, "y": 470}, {"kind": "up", "x": 620, "y": 470}]}]
          ]'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-images
          path: out/
          if-no-files-found: warn
